name: roadguard_ai
description: RoadSafe - Crowd-verified road hazard alerts
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  camera: ^0.11.0
  image_picker: ^1.1.2
  flutter_tts: ^4.0.2
  phosphor_flutter: ^2.0.0
  intl: ^0.19.0
  socket_io_client: ^2.0.3
  permission_handler: ^11.3.1
  url_launcher: ^6.2.5
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/